services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    # Docker-specific values override .env, so the same .env also works for local `runserver`.
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DEBUG: "False"
      # Secure (HTTPS-only) session cookie: right for the tunnel. Chrome/Firefox also accept it on
      # http://localhost; for Safari on plain localhost set DOCKER_REFRESH_COOKIE_SECURE=False in .env.
      REFRESH_COOKIE_SECURE: ${DOCKER_REFRESH_COOKIE_SECURE:-True}
      # localhost + Cloudflare quick tunnels (https://<random>.trycloudflare.com) for demos
      ALLOWED_HOSTS: ${DOCKER_ALLOWED_HOSTS:-localhost,127.0.0.1,.trycloudflare.com}
      CSRF_TRUSTED_ORIGINS: ${DOCKER_CSRF_TRUSTED_ORIGINS:-http://localhost,https://*.trycloudflare.com}
      MEDIA_ROOT: /data/media
      STATIC_ROOT: /data/static
    volumes:
      - media_data:/data/media
      - static_data:/data/static
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/data/static:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  media_data:
  static_data:
