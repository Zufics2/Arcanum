# Privacy: no access log, so client IP addresses are never written anywhere.
access_log off;

upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    server_tokens off;

    # Files are encrypted whole in the browser (limit 200 MB) plus GCM/multipart overhead.
    client_max_body_size 210m;

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # X-Forwarded-For / X-Real-IP are deliberately NOT forwarded: the backend does not need client IPs.
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django static files (admin, Swagger UI), collected into a shared volume.
    location /static/ {
        alias /data/static/;
        expires 7d;
    }

    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
