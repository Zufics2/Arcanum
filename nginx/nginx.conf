# Privacy: client IP addresses are never written anywhere.
# No access log; the error log stays at "crit", because regular errors (e.g. upstream unavailable)
# are logged with "client: <ip>".
access_log off;
error_log /dev/stderr crit;

# Text assets only: ciphertext is random and does not compress.
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

# Behind a TLS-terminating proxy (Cloudflare Tunnel) keep its X-Forwarded-Proto, so Django knows
# the request was HTTPS; when accessed directly, fall back to our own scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    server_tokens off;

    # Files are encrypted whole in the browser (limit 200 MB) plus GCM/multipart overhead.
    client_max_body_size 210m;

    # --- Security headers (zero-knowledge relies on the browser code staying trustworthy) ---
    # CSP: only our own code may run, nothing loads from third parties.
    #  - 'unsafe-inline' scripts: Next.js hydration data; styles: Ant Design CSS-in-JS.
    #  - blob: for decrypted previews (images, video/audio, PDF in an iframe).
    #  - frame-ancestors 'self' (not 'none'): the PDF preview frames a blob: document of our own origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; frame-src 'self' blob:; object-src 'self' blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Share pages (/s/<id>) must not leak their path to other sites via Referer.
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # With HTTPS, also add: Strict-Transport-Security "max-age=31536000; includeSubDomains"

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # X-Forwarded-For / X-Real-IP are deliberately NOT forwarded: the backend does not need client IPs.
        proxy_request_buffering off;   # stream uploads to Django instead of buffering 200 MB here
        proxy_max_temp_file_size 0;    # stream downloads as well
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Django static files (admin, Swagger UI), collected into a shared volume.
    # Encrypted blobs (media) are NOT exposed: they are served only through the authenticated API.
    location /static/ {
        alias /data/static/;
        expires 7d;
    }

    # Next.js (it sets long-lived immutable caching for /_next/static/ itself).
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
